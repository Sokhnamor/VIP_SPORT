# nginx : SPA (frontend) + API Laravel sur le même domaine.
# En production, placer un terminateur HTTPS devant (Caddy, Traefik ou certbot) :
# la caméra du poste de scan n'est accessible qu'en HTTPS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # API, cookie CSRF Sanctum et sonde de santé → PHP-FPM
    location ~ ^/(api|sanctum|up)(/|$) {
        fastcgi_pass app:9000;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param HTTPS $http_x_forwarded_proto if_not_empty;
        fastcgi_read_timeout 120s;
    }

    # Fichiers versionnés : cache long
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Le service worker doit toujours être revalidé
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # Routes de la SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
