; Réglages PHP de production
expose_php = Off
display_errors = Off
log_errors = On
memory_limit = 256M
upload_max_filesize = 6M
post_max_size = 8M
max_execution_time = 60
date.timezone = UTC

session.cookie_httponly = 1
session.use_strict_mode = 1

opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
